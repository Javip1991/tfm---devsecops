name: DevSecOps Security Pipeline

on:
  push:
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SAST - Bandit
        uses: PyCQA/bandit-action@v1
        with:
          targets: .

      - name: DAST - Nikto
        run: |
          docker run --rm sullo/nikto -h https://example.com

      - name: Security Check
        run: |
          echo "DevSecOps security pipeline completed"
